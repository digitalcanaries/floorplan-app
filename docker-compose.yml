services:
  floorplan:
    build: .
    ports:
      - "3080:3080"
    volumes:
      - floorplan-data:/app/data
    restart: unless-stopped
    container_name: floorplan-app
    # R2 credentials + JWT secret live in .env on the host (gitignored).
    # See DEPLOY.md — the .env file is created on the Lightsail server
    # once per instance and doesn't ship with the repo.
    env_file:
      - .env
    environment:
      - JWT_SECRET=${JWT_SECRET:-floorplan-secret-key-change-me}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}

volumes:
  floorplan-data:
